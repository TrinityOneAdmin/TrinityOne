<link rel="icon" type="image/png" sizes="192x192" href="icons/steward-192.png" />

<style>
  /* token supplements not in brand.css */
  :root {
    --surface-2: #FBF5EA;
    --mono: 'SF Mono', ui-monospace, 'Menlo', monospace;
    --font-read: 'Newsreader', Georgia, serif;
    --shadow: 0 1px 2px rgba(34,28,16,.05), 0 6px 18px rgba(34,28,16,.06);   /* index.html's value; the help cards (screens-help.jsx) use it */
  }
  html, body { margin: 0; height: 100%; background: #efece6; }
  #root { height: 100vh; }
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  /* SETTINGS: A LIST OF PAGES, AND ONE PAGE AT A TIME.
     reference/DECISION-SETTINGS-LIST-AND-DETAIL-2026-09-09.md. This replaced `.sk-cols` (a two-track grid
     of authored stacks) which itself replaced `.sk-masonry { column-width: 330px }` — CSS multi-column,
     where the BROWSER chose the break point, so the reading order, the Tab order and the split all moved
     whenever a card grew.
     The stacks fixed the moving, and did not fix the height: measured 2026-09-08 at 1280x713, each section
     still ran about two screenfuls (Church 1219px, Features 1599px, Network & relays 1242px, Security
     1364px against a 649px viewport) because the height is CONTENT — one section doing six jobs at once.
     Two rounds of density work took Features to 1034px and stopped there.
     So nothing packs any more. One page holds one subject, and it is the only thing on screen.
     ALL THREE OLD RULES ARE DELETED RATHER THAN LEFT BEHIND (.sk-cols, .net-grid, .relay-grid). Each was a
     packing grid with exactly one user, and a packing rule left lying in this file is one a future card can
     pick up by accident — the same reason .sk-masonry was deleted rather than orphaned.
     THE TWO-COLUMN / ONE-COLUMN CHOICE IS MADE IN JS, not here: DashSettings already asks useStewNarrow()
     which surface it is on, because on a phone it renders EITHER the list or the page and never both. A
     media query here as well would be a second answer to a question that already has one, free to disagree
     with it. */
  .set-shell { display: grid; grid-template-columns: minmax(200px, 236px) minmax(0, 1fr); gap: 22px; align-items: start; max-width: 1180px; }
  .set-shell--one { grid-template-columns: minmax(0, 1fr); gap: 0; }   /* phone: one of the two children is rendered */
  .set-list { display: block; }
  /* A GROUP HEADER IS A DISCLOSURE BUTTON, not a label. It carries aria-expanded, so it has to be a real
     button; everything here is the reset that makes a button look like the small-caps label it replaced.
     44px of height is not available in a 236px sidebar column, but the whole row is the target rather than
     the chevron alone — the console has already paid for a control where only the small part responded
     ("you have to hit the little switch itself rather than the words, which Margaret will not work out"). */
  .set-grp { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: none; background: none; cursor: pointer;
             font-size: 11px; letter-spacing: .9px; text-transform: uppercase; color: var(--ink-3); font-weight: 800;
             margin: 16px 0 6px; padding: 4px 10px; border-radius: 8px; font-family: var(--font-ui); }
  .set-grp:hover { background: color-mix(in oklab, var(--ink) 4%, transparent); color: var(--ink-2); }
  .set-grp-n { flex: 1; min-width: 0; }
  /* HOW MANY PAGES ARE BEHIND A SHUT GROUP. Without it a collapsed group is a word with nothing to say
     whether anything is in there, which is the one thing a steward needs to know before opening it. */
  .set-grp-c { font-size: 10.5px; font-weight: 700; letter-spacing: 0; color: var(--ink-3); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
  .set-list > :first-child.set-grp { margin-top: 2px; }
  .set-items { list-style: none; margin: 0; padding: 0; }
  .set-item { display: block; width: 100%; text-align: left; border: none; background: none; font-family: var(--font-ui); color: var(--ink); padding: 9px 11px; border-radius: 10px; cursor: pointer; }
  .set-item:hover { background: color-mix(in oklab, var(--ink) 5%, transparent); }
  /* NOT COLOUR ALONE — the weight carries it too; see the note on the nav button in stew-dashboard.jsx. */
  .set-item--on { background: color-mix(in oklab, var(--clay) 12%, var(--surface)); }
  .set-item-n { display: block; font-size: 13.5px; font-weight: 600; }
  .set-item--on .set-item-n { font-weight: 800; color: var(--clay-ink); }
  .set-item-d { display: block; font-size: 11.5px; color: var(--ink-3); line-height: 1.35; margin-top: 1px; }
  .set-back { display: inline-flex; align-items: center; gap: 5px; border: none; background: none; padding: 2px 0 4px; cursor: pointer; font-family: var(--font-ui); font-size: 13px; font-weight: 700; color: var(--clay-ink); }
  /* THE PAGE, and the CONTAINER every density rule below measures. It replaces `.sk-cols > *` exactly —
     same flex column, same 16px gap, same min-width:0, same container-type — so a card gets the roomy
     values while the page is under 430px and the compact ones once it is wider, whatever the window is
     doing. On a phone the page is about 336px, which is the roomy layout the owner has confirmed twice.
     The cap is a reading measure, not a grid: one column of text at ~1000px sets a sentence too long to
     scan, and the widest thing on any of these pages is a relay address. */
  .set-page { display: flex; flex-direction: column; gap: 16px; min-width: 0; max-width: 860px; container-type: inline-size; }
  /* ── SETTINGS DENSITY (2026-09-08) ────────────────────────────────────────────────────────────────
     Measured in Chromium at 1280x713 with a real church loaded: every Settings section ran about two
     screenfuls — Church 1219px, Features 1599px, Network & relays 1242px, Security 1364px, against a
     649px viewport. Two things I assumed were wrong and are recorded so nobody re-tries them:
       • the width is NOT going spare. 1265px page = 199px nav + 1033px main (28px padding). Measured
         against the two-track .sk-cols this replaced, the cards sat at 977px and never reached their own
         1120px cap, so raising a cap changes nothing here.
       • the toggle rows are ALREADY label-left / switch-right. They are 79px because the description
         wraps to two lines in a 435px card, not because anything is stacked.
     So the height is padding and leading, and that is what these rules take back. Roomy stays the
     default; a page only goes compact once it is wide enough that the text is not fighting for room. */
  .sk-panel { padding: 22px; }
  .set-row { padding: 11px 13px; }
  .set-desc { font-size: 12.5px; line-height: 1.45; margin-top: 1px; }
  @container (min-width: 430px) {
    .sk-panel { padding: 15px 17px; }
    .sk-panel-head { margin-bottom: 10px !important; }
    .set-row { padding: 7px 12px; }
    .set-desc { font-size: 12px; line-height: 1.35; margin-top: 0; }
    /* The standing explanation under a panel title. The words stay — this console describes consequences
       rather than prescribing policy, and hiding them behind a click would be the wrong trade. They just
       stop setting the height of the page. */
    /* !important because these keep their inline styles: those ARE the roomy phone default, and the
       class only has to win inside this query. */
    .set-note { font-size: 12px !important; line-height: 1.35 !important; margin-bottom: 7px !important; }
    /* cards on a page sit closer once the page is wide */
    .set-page { gap: 12px; }
    /* ROUND TWO, 2026-09-08. The owner looked at round one in a browser and said it was still too bulky and
       to drop the type as well — and confirmed the APK is right as it is, which is exactly what these
       container queries protect. Everything below is desktop-only for that reason. Sizes are set here
       rather than inline so one place governs the whole tab. */
    .sk-panel h2 { font-size: 15px !important; }
    .sk-panel { font-size: 13px; }
    .set-row > div > div:first-child { font-size: 13.5px !important; }   /* the switch's own label */
    .sk-panel .sk-btn { font-size: 12.5px !important; padding: 8px 13px !important; }
  }
  /* .net-grid and .relay-grid were here. Both are gone: Network and Relays are separate pages now, and the
     Relays card's "many sections" — add, auto-find, connect by name, copy history, keep in sync — are pages
     of their own, so there is nothing left on either to pack two-across. The lesson they recorded is kept
     because it still applies to anything added here: they were sized from the CARD and not the viewport,
     after a 1120px *viewport* media query gave the Relays card two ~150px columns at a 1130px window and
     broke every line to one word — the card lived inside a sidebar and a grid track, so the window's width
     said nothing about its own. That is why .set-page is a container and not a media query. */
  .stew-root *::-webkit-scrollbar { width: 0; height: 0; }

  /* steward UI primitives (from the handoff's Steward Surfaces stylesheet) */
  .sk-pill { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-ui); font-weight:700; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; padding:5px 11px; border-radius:999px; background:var(--clay-soft); color:var(--clay-ink); }
  .sk-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-ui); font-weight:700; font-size:14px; padding:11px 18px; border-radius:12px; border:none; cursor:pointer; background:var(--ink); color:var(--paper); line-height:1; transition:transform .15s, box-shadow .15s, background .15s; }
  .sk-btn:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .sk-btn--clay { background:var(--clay-ink); color: var(--on-clay); }   /* a11y: white on --clay is 4.36:1; --clay-ink is 5.87:1 */
  .sk-btn--gold { background:var(--gold); color:var(--midnight); }
  .sk-btn--ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.4px var(--line); }
  .sk-btn--ghost:hover { box-shadow:inset 0 0 0 1.4px var(--ink); }
  .sk-mono { font-family:var(--mono); }

  @keyframes lumenFade  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes lumenScale { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes trinitySpin { to { transform: rotate(360deg); } }
</style>
