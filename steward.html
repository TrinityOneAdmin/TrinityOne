<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrinityOne — Steward Console</title>
<link rel="icon" href="icons/steward-halo.svg" type="image/svg+xml" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/steward-192.png" />
<link rel="apple-touch-icon" href="icons/steward-apple-touch.png" />
<link rel="stylesheet" href="vendor/fonts/fonts.css" />
<link rel="stylesheet" href="brand.css" />
<style>
  /* token supplements not in brand.css */
  :root {
    --surface-2: #FBF5EA;
    --mono: 'SF Mono', ui-monospace, 'Menlo', monospace;
    --font-read: 'Newsreader', Georgia, serif;
  }
  html, body { margin: 0; height: 100%; background: #efece6; }
  #root { height: 100vh; }
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  /* masonry card layout: packs variable-height cards tightly, no dead rows */
  .sk-masonry { column-width: 330px; column-gap: 16px; }
  .sk-masonry > * { break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 16px; }
  /* Network tab: Network card (narrow) beside the wide Relays card on desktop; stacks on a phone. */
  .net-grid { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
  @media (min-width: 940px) { .net-grid { grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); } }
  /* The Relays card's many sections, two across on a wide card and one when narrow. Sized from the CARD,
     not the viewport: this used to split at a 1120px *viewport* media query, but the card lives inside a
     sidebar and a grid track, so a 1130px window gave it two ~150px columns and broke every line to one
     word. auto-fit measures the space actually available. */
  /* min(300px,100%) so the track can never exceed the card: a bare minmax(300px,…) keeps a 300px floor even
     when the card is narrower, poking inputs past the border (narrow phones, and the 940px two-column band). */
  .relay-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 2px 24px; align-items: start; }
  .stew-root *::-webkit-scrollbar { width: 0; height: 0; }

  /* steward UI primitives (from the handoff's Steward Surfaces stylesheet) */
  .sk-pill { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-ui); font-weight:700; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; padding:5px 11px; border-radius:999px; background:var(--clay-soft); color:var(--clay-ink); }
  .sk-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-ui); font-weight:700; font-size:14px; padding:11px 18px; border-radius:12px; border:none; cursor:pointer; background:var(--ink); color:var(--paper); line-height:1; transition:transform .15s, box-shadow .15s, background .15s; }
  .sk-btn:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .sk-btn--clay { background:var(--clay); color: var(--on-clay); }
  .sk-btn--gold { background:var(--gold); color:var(--midnight); }
  .sk-btn--ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.4px var(--line); }
  .sk-btn--ghost:hover { box-shadow:inset 0 0 0 1.4px var(--ink); }
  .sk-mono { font-family:var(--mono); }

  @keyframes lumenFade  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes lumenScale { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes trinitySpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root">
  <!-- Static boot state, replaced by React on mount. The console transpiles ~2 MB of JSX in-browser, which is
       seconds of flat grey on a phone with no indication anything is happening. -->
  <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#efece6;font-family:'Sora',system-ui,sans-serif">
    <div style="width:54px;height:54px;border-radius:16px;background:linear-gradient(155deg,#C25A38,#9C4327);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 8px 22px rgba(34,28,16,.18)">T1</div>
    <div style="font-size:14px;font-weight:700;color:#221C16">Opening your console…</div>
    <div style="font-size:12px;color:#6B6052">Getting your church ready</div>
  </div>
</div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>

<!-- church identity + Nostr publishing (church key, funds, profile); exposes window.Steward -->
<script src="vendor/steward.js"></script>
<!-- memory-hard Argon2id KDF (window.TrinityRecovery.argon2Raw) so the church-key backup file uses it too -->
<script src="vendor/recovery.js"></script>
<!-- double-entry ledger engine (FINANCE-MODULE.md); exposes window.FinanceLedger -->
<script src="vendor/finance-ledger.js"></script>
<!-- optional Manna module (money-out / disbursements; encrypted to the church key); exposes window.StewardManna -->
<script src="vendor/steward-manna.js"></script>
<!-- optional Meal trains / practical-care module (community-glue); exposes window.StewardMeals -->
<script src="vendor/steward-meals.js"></script>
<script src="vendor/jsqr.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<!-- shared line icons (window.Icon + window.Halo) -->
<script type="text/babel" src="app/icons.jsx"></script>
<!-- shared modal a11y (window.useStewDialog): role=dialog/aria-modal/Escape/focus for the console's dialogs -->
<script type="text/babel" src="app/stew-modal.jsx"></script>
<!-- steward surfaces (mock SK data + the four surfaces) -->
<script type="text/babel" src="app/stew-data.jsx"></script>
<script type="text/babel" src="app/recur.jsx"></script>
<script type="text/babel" src="app/stew-console.jsx"></script>
<script type="text/babel" src="app/stew-schedule.jsx"></script>
<script type="text/babel" src="app/stew-templates.jsx"></script>
<script type="text/babel" src="app/stew-dashboard.jsx"></script>
<script type="text/babel" src="app/stew-finance.jsx"></script>
<script type="text/babel" src="app/stew-manna.jsx"></script>
<script type="text/babel" src="app/stew-meals.jsx"></script>
<script type="text/babel" src="app/stew-relay.jsx"></script>
<script type="text/babel" src="app/stew-extension.jsx"></script>
<script type="text/babel" src="app/stew-phone.jsx"></script>
<script type="text/babel" src="app/stew-custody.jsx"></script>
<script type="text/babel" src="app/backup.jsx"></script>
<script type="text/babel" src="app/steward-root.jsx"></script>
<!-- shared service worker registration (web-push for join alerts) — external so CSP can drop inline -->
<script src="sw-register.js"></script>
</body>
</html>
