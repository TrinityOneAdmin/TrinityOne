<!doctype html>
<!-- Social share-card template for TrinityOne. NOT web-served — rendered to PNG at
     build time by scripts/make-og-cards.sh (headless chromium, 1200x630).
     Variants via ?v=join (the church join link) or ?v=site (any marketing page).
     Edit the copy in CARDS below, then re-run the script. -->
<meta charset="utf-8">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
  :root{
    --paper:#F4EEE2; --paper-soft:#FBF6EC;
    --ink:#221C16; --ink-2:#6B6052;
    --clay:#C25A38; --gold-soft:#E0B860; --clay-deep:#9C4327; --gold:#C8962E; --line:#E4D8C4;
    --serif:'Newsreader',Georgia,serif; --ui:'Sora',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, var(--paper-soft) 0%, var(--paper) 62%);
    font-family:var(--ui); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:100%; height:100%;
    border:1px solid var(--line);
    box-shadow:inset 0 0 0 10px var(--paper), inset 0 0 0 11px var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 96px;
  }
  .icon{
    width:132px; height:132px; border-radius:30px;
    box-shadow:0 14px 34px rgba(156,67,39,.22), 0 3px 8px rgba(34,28,22,.10);
  }
  .eyebrow{
    display:none;
    font-weight:700; font-size:20px; letter-spacing:4.5px;
    text-transform:uppercase; color:var(--clay); margin-top:30px;
  }
  h1{
    font-family:var(--serif); font-style:italic; font-weight:500;
    font-size:70px; line-height:1.04; letter-spacing:-1px;
    margin-top:34px; max-width:16ch; text-wrap:balance;
  }
  .sub{
    font-weight:400; font-size:29px; line-height:1.42; color:var(--ink-2);
    margin-top:22px; max-width:26ch; text-wrap:balance;
  }
  .cta{
    display:none;
    margin-top:40px; font-weight:600; font-size:25px;
    color:var(--clay-deep); letter-spacing:.2px;
  }
  .cta::before{content:"";}
  /* per-variant switches, toggled by the boot script's class on <body> */
  body.v-join .cta{display:block}
  /* eyebrow supported but unused; shown only if a variant sets non-empty eyebrow text */
  body.has-eyebrow .eyebrow{display:block}
  body.has-eyebrow h1{margin-top:16px}

  /* ---- v2 "Midnight halo" (owner-chosen direction A, 2026-11-16). Variants: ?v=cover2 / ?v=join2.
     The legacy cream variants (join/site) above are kept so og-join.png / og-cover.png can be
     regenerated, but make-og-cards.sh now renders only the v2 cards. ---- */
  .mid{display:none}
  body.v2{display:block;position:relative;overflow:hidden;color:var(--paper);
    background:radial-gradient(70% 90% at 82% 50%,#5a2a18 0%,#2b1a10 45%,#17120B 100%)}
  body.v2 .card{display:none}
  body.v2 .mid{display:block}
  body.v2 .mid.brand{display:flex}  /* must follow .mid{display:block} or the row never flexes */
  .mid.ring{position:absolute;right:-250px;top:-60px;width:760px;height:760px;opacity:.95}
  .mid.brand{position:absolute;left:84px;top:56px;display:none;align-items:center;gap:24px}
  .brand img{width:88px;height:88px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .brand b{font-weight:800;font-size:44px;letter-spacing:5px;text-transform:uppercase}
  .mid.rule{position:absolute;left:84px;top:172px;width:64px;height:3px;background:var(--gold-soft)}
  .mid.h2{position:absolute;left:84px;top:200px;width:600px;font-family:var(--serif);font-style:italic;
    font-weight:500;font-size:84px;line-height:1.03;letter-spacing:-1.5px}
  .h2 em{color:var(--gold-soft)}
  .mid.tag{position:absolute;left:84px;bottom:44px;width:620px;font-size:40px;line-height:1.28;color:#d6c9b3}
  .mid.pill{position:absolute;left:84px;bottom:76px;padding:22px 52px;border-radius:999px;
    background:var(--clay);color:var(--paper);font-weight:600;font-size:40px;letter-spacing:.3px;
    box-shadow:0 10px 28px rgba(0,0,0,.35)}
  body.v2-cover .pill{display:none} body.v2-join .tag{display:none}
</style>
<body>
  <svg class="mid ring" viewBox="0 0 512 512"><g fill="none" stroke="#C25A38" stroke-width="34" stroke-linecap="round"><path d="M 416.5 346.3 A 184.2 184.2 0 0 1 159.4 412.8"/><path d="M 97.5 349.9 A 184.2 184.2 0 0 1 168.5 93.9"/><path d="M 254.0 71.8 A 184.2 184.2 0 0 1 440.1 261.3"/></g><circle cx="256" cy="256" r="34" fill="#E0B860"/></svg>
  <div class="mid brand"><img src="../icons/halo.svg" alt=""><b>TrinityOne</b></div>
  <div class="mid rule"></div>
  <h1 class="mid h2" id="h2"></h1>
  <div class="mid tag" id="tag"></div>
  <div class="mid pill" id="pill"></div>
  <div class="card">
    <img class="icon" src="../icons/halo.svg" alt="">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="head"></h1>
    <div class="sub" id="sub"></div>
    <div class="cta" id="cta"></div>
  </div>
<script>
  var CARDS = {
    // The church JOIN link (join.html / welcome.html / install-anywhere.html / migrate.html)
    join: {
      eyebrow: '',
      head: 'Join your church on TrinityOne',
      sub: 'Scripture, prayer, groups and care — one private place. No account, nothing to install.',
      cta: 'Tap to join'
    },
    // Any marketing page (index / features / why / about / help / downloads) — a plain site URL,
    // i.e. a church LEADER arriving, not an invited member. Mirrors the join card: "Build" vs "Join".
    site: {
      eyebrow: '',
      head: 'Build your church on TrinityOne',
      sub: 'Scripture, prayer, groups, serving and care — on your church’s own server. No Big Tech, no ads.',
      cta: ''
    }
  };
  var V2 = {
    cover2: {h: 'A private home for <em>your church.</em>', tag: 'Scripture, prayer, groups and care on a server you own.', pill: ''},
    join2:  {h: 'Join your church on <em>TrinityOne</em>', tag: '', pill: 'Tap to join'}
  };
  var v = (new URLSearchParams(location.search).get('v') || 'join');
  if (V2[v]) {
    document.body.className = 'v2 v2-' + v.replace('2','');
    document.getElementById('h2').innerHTML = V2[v].h;
    document.getElementById('tag').textContent = V2[v].tag;
    document.getElementById('pill').textContent = V2[v].pill;
    document.title = 'og-' + v;
    throw 0; // stop: legacy boot below is for the cream variants only
  }
  var c = CARDS[v] || CARDS.join;
  document.body.className = 'v-' + (CARDS[v] ? v : 'join') + (c.eyebrow ? ' has-eyebrow' : '');
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('head').textContent = c.head;
  document.getElementById('sub').textContent = c.sub;
  document.getElementById('cta').textContent = c.cta;
  document.title = 'og-' + v;
</script>
</body>
