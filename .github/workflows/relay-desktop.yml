# Build the TrinityOne Relay desktop app for macOS, Windows and Linux — the double-click installers a church
# downloads to self-host its relay. Each runner builds its own native OS (no cross-compiling the hard parts):
# the Tauri shell wraps a bundled Node runtime + the read-only relay payload, so end users install nothing else.
#
#   • push a tag  relay-v1.2.3   → builds all platforms AND attaches the installers to a GitHub Release
#   • Run workflow (manual)      → builds all platforms and uploads them as artifacts (no release) — use to test
#
# First-run notes (this is expected to need a CI pass or two to settle, per the desktop-build plan):
#   - NODE_VERSION below must be a real nodejs.org/dist version; bump it if the sidecar download 404s.
#   - macOS/Windows signing is deliberately NOT wired yet — unsigned installers build fine but warn on open.
name: relay-desktop

on:
  push:
    tags: ["relay-v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to attach installers to a Release on tag builds

env:
  NODE_VERSION: "22.22.2"        # the Node runtime bundled INTO the app (has node:sqlite); != the build Node below
  # WHICH COMMIT THIS BUILD PACKAGES. build-relay-payload.sh → build-strict-tgz.sh `git archive` this ref;
  # it defaults to `main` and deliberately never falls back to HEAD (RELEASE-2026-07-20 C1 — the release host
  # once signed whatever it happened to have checked out and pushed it fleet-wide).
  #
  # relay-v0.8.0 failed on all three platforms 20s in with "build-strict-tgz: release ref 'main' does not
  # resolve": actions/checkout@v4 on a tag push fetches `+<sha>:refs/tags/<tag>` at depth 1 and checks it out
  # DETACHED, so this checkout has the tag and no `main` at all. github.ref_name is the tag name on a tag push
  # and the branch name on a manual run — each resolves in its own checkout, and a tag build now ships the
  # commit that was tagged rather than whatever `main` points at (tagging one commit and shipping another
  # would be its own trap). Nothing here reintroduces C1: the ref is still named, never inferred from HEAD.
  RELEASE_REF: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `bundles` restricts formats per-OS: Windows uses NSIS only (the WiX MSI bundler chokes on the large
        # payload tree), Linux ships AppImage + deb, macOS ships a .dmg. `stable` is the version-less name we
        # ALSO publish each installer under, so the app can link releases/latest/download/<stable> forever.
        #
        # macOS INTEL (macos-13 / x86_64-apple-darwin / stable name macos-x64) IS DELIBERATELY NOT HERE.
        # Three comments have now stood where this one does, and the first TWO were false: one said Intel was
        # "intentionally omitted" while it sat in the matrix below, and one said "if it queues, the other
        # assets still publish". The THIRD was mine (182b018, 2026-09-18) and was also false: it said removing
        # Intel "is what makes this workflow publish anything at all", and that Linux, Windows and
        # Apple-silicon builds "that finished in minutes were thrown away three times over". Measured against
        # the run history and the release assets, neither holds. If you are here debugging a failed tag, the
        # thing to know is that THERE WERE TWO SEPARATE BLOCKERS, discovered one at a time:
        #
        # (1) macos-13 never gets a runner — and that is a 24-HOUR HANG, not a lost upload. The last run to
        #     end green before today was 29084950936 (10 Jul, 9m29s), whose matrix had three jobs and no
        #     Intel; it created the relay-v0.7.1 release at 10:04. Intel was in the matrix for the 42 runs
        #     after it (37 cancelled, 4 failed, all at GitHub's 24h ceiling) and that job never once started.
        #     But `fail-fast: false` did keep the siblings BUILDING AND UPLOADING: in run 29102861720 (10 Jul
        #     15:13) linux / windows / macos-arm64 each ended `success` in 3-7 minutes and their installers
        #     sit on the relay-v0.7.1 release stamped 15:16:49-15:20:00 — inside that same run. Same again
        #     from the 12 Jul run (Suite assets 06:14-06:18). The hang still costs real things (the run is
        #     red, it holds a concurrency slot for a day, and a human has to go and check the assets landed),
        #     but it is NOT why the later tags shipped nothing.
        #
        # (2) The release ref stopped resolving in a TAG checkout — which is what actually killed 0.7.2
        #     onwards. build-strict-tgz.sh gained REF="${2:-main}" between relay-v0.7.1 (which archived HEAD
        #     and took no ref at all) and relay-v0.7.2, while build-relay-payload.sh still called it with no
        #     ref; actions/checkout@v4 on a tag push leaves a shallow DETACHED checkout with no `main`. Every
        #     sibling job therefore died at "Assemble the relay payload" in under 90 seconds:
        #         relay-v0.7.2      24 Jul   3/3 siblings failed in 34-68s
        #         relay-v0.8.0-rc1  25 Aug   3/3 siblings failed in 30-63s
        #         relay-v0.8.0      18 Sep   3/3 siblings failed in 40-80s — with Intel ALREADY REMOVED
        #     For those tags nothing "finished in minutes"; there was never an installer to throw away, and
        #     that last row is the proof that dropping Intel on its own would not have published a thing.
        #     Fixed separately, by RELEASE_REF above (b3e55dd).
        #
        # TrinityOne-Suite-macos-x64.* has never shipped on any release, so nothing that exists is being
        # withdrawn. GitHub's "latest release" is still relay-v0.7.1 from 10 July, and the website's download
        # links point at it.
        #
        # TO COME BACK once we know WHY that runner never materialises — label retired, quota, or the image's
        # deprecation; not established here. What IS established is that "it is slow" is not the answer: the
        # job never starts at all. The owner is getting Mac hardware for iPhone work anyway, so an Intel build
        # may end up being cut locally rather than here. Apple silicon (macos-14) builds fine in minutes and
        # is the macOS download the website advertises; it is untouched.
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            stable: linux-x86_64
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
            bundles: app,dmg
            stable: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            stable: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Node used only to BUILD (npm ci → esbuild for the payload transpile, and the Tauri CLI). Not shipped.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relay-app/desktop/src-tauri/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('relay-app/desktop/src-tauri/Cargo.toml') }}

      - name: Linux — Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            build-essential file wget

      - name: Install build deps (esbuild etc.)
        run: npm ci

      - name: Assemble the relay payload (read-only app code the shell runs)
        shell: bash
        run: bash scripts/build-relay-payload.sh relay-app/desktop/src-tauri/payload

      - name: Fetch the Node runtime sidecar for this target
        shell: bash
        run: bash scripts/fetch-node-sidecar.sh ${{ matrix.target }}

      - name: Fetch the cloudflared tunnel sidecar for this target
        shell: bash
        run: bash scripts/fetch-cloudflared-sidecar.sh ${{ matrix.target }}

      - name: Generate app icons from app-icon.png
        working-directory: relay-app/desktop
        run: npx --yes @tauri-apps/cli@2 icon src-tauri/app-icon.png

      - name: Build the desktop app
        working-directory: relay-app/desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # AppImage tooling can't FUSE-mount on CI runners
          # macOS signing + notarization — all EMPTY until you add the secrets, in which case Tauri builds an
          # UNSIGNED app exactly as now. Add these repo secrets to auto-sign (removes the Gatekeeper warning):
          #   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri treats a DEFINED-but-empty APPLE_CERTIFICATE as "please sign" and then fails importing an
          # empty cert. So with no secrets configured, unset them all → a clean UNSIGNED build. With the cert
          # present, they stay set and Tauri signs + notarizes.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Gather the installers into one flat dir. Each is published under BOTH its Tauri (versioned) name AND a
      # version-less stable name (TrinityOne-Relay-<stable>.<ext>) so the app can link a permanent
      # releases/latest/download/<stable> URL that never needs bumping.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          BND="relay-app/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          # -print0/read -d '' so filenames containing spaces (Tauri's "TrinityOne Relay_…") are safe.
          find "$BND" -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) -print0 |
          while IFS= read -r -d '' f; do
            cp "$f" dist-installers/                                        # versioned (Tauri) name
            ext="${f##*.}"
            case "$ext" in
              exe) cp "$f" "dist-installers/TrinityOne-Suite-${{ matrix.stable }}-setup.exe" ;;
              *)   cp "$f" "dist-installers/TrinityOne-Suite-${{ matrix.stable }}.$ext" ;;
            esac
          done
          # Version manifest for the in-app update check. sha MUST match the payload's version.txt so
          # /suite-update compares like-for-like — so resolve the SAME ref build-relay-payload.sh stamped
          # (RELEASE_REF), not HEAD. Every matrix job writes the same sha; softprops clobbers by filename on
          # the Release, so one wins harmlessly.
          SHA="$(git rev-parse --verify "${RELEASE_REF}^{commit}")"
          printf '{"sha":"%s","version":"%s","tag":"%s"}\n' "$SHA" "${GITHUB_REF_NAME#relay-v}" "${GITHUB_REF_NAME}" > dist-installers/suite-latest.json
          ls -la dist-installers || true

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: trinityone-relay-${{ matrix.target }}
          path: dist-installers/*
          if-no-files-found: warn

      - name: Attach installers to the Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/relay-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*
          fail_on_unmatched_files: false
          # PRERELEASE FOR -rc AND -branch- TAGS, and this is not cosmetic. Every deployed relay decides
          # whether an update exists by reading releases/latest/download/suite-latest.json (gateway.mjs,
          # /suite-update). GitHub's "latest" IGNORES prereleases — so without this flag, pushing a tag to
          # get yourself an installer to test also tells every church's server that an upgrade is waiting,
          # for a build nobody has run yet. Cut an -rc tag, test the installer, then publish the clean
          # relay-vX.Y.Z tag when you actually mean it.
          # NB the whole ref is "relay-v0.8.0", which already contains a hyphen — so this must match the
          # suffix explicitly rather than asking whether a hyphen is present anywhere.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-branch-') }}
