# The release gate — scoped to the safety-critical invariants it was created for.
#
# SECURITY-AUDIT-2026-07-20 H1 created this gate because NO workflow ran the tests at all: a failing
# relay-privacy read gate (the anonymous roster/DM read gate — the arrest-list-grade invariant), a broken
# Shamir round-trip, a broken ledger, or a vendor/ bundle that no longer matches its source could reach
# production with no signal whatsoever.
#
# 2026-10-19: the gate ran the WHOLE suite and so was red on every push — "Run failed" emails that meant
# nothing. The full suite (763 files) cannot pass on a bare GitHub runner and never could: ~68 files drive a
# real browser (they flake/time out on the runner's Chrome), some need a phone-style IndexedDB the runner
# lacks, and a couple are KNOWN OPEN UI defects (the 320/360px header overflow). Those are verified on the
# attached PHONES (CLAUDE.md §6), not here. A permanently-red gate guards nothing, so this now runs exactly
# the pure-node, safety-critical invariants the gate exists for — the list is scripts/ci-safe-tests.txt, and
# scripts/ci-manifest-is-honest.test.mjs (run below, because it is in that list) stops the list being
# silently hollowed out. GREEN here = the arrest-list-grade invariants still hold.
name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — bundle-contents/release tests read git archive + ancestry
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'   # pinned to the version the relay + build scripts are developed against
          cache: npm
      - run: npm ci
      # Resolve the manifest to a file list. Fail LOUDLY if it is missing or resolves to nothing — an empty
      # operand list would make run-tests.mjs fall back to the WHOLE suite (its no-named-files branch), the
      # opposite of what this gate wants, so we never hand it an empty list.
      - name: Resolve the safety-test manifest
        id: manifest
        run: |
          set -euo pipefail
          test -s scripts/ci-safe-tests.txt || { echo "::error::scripts/ci-safe-tests.txt is missing or empty"; exit 1; }
          FILES=$(grep -vE '^[[:space:]]*(#|$)' scripts/ci-safe-tests.txt | sed 's/#.*//; s/[[:space:]]*$//; s|^|scripts/|' | grep -vE '^scripts/$' | tr '\n' ' ')
          test -n "$FILES" || { echo "::error::the manifest resolved to no test files"; exit 1; }
          echo "count=$(printf '%s\n' $FILES | grep -c .)" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          printf 'CI will run %s safety test file(s):\n' "$(printf '%s\n' $FILES | grep -c .)"
          printf '  %s\n' $FILES
      # vendor-freshness.test.mjs rebuilds every src/*.src.js with the real build-*.sh and asserts the
      # committed vendor/ bundles match — the check that would have caught the stale finance-ledger.js
      # shipping unbranded statements to churches for three days. (npm ci gives a real node_modules, so
      # esbuild stamps relative paths — do not share node_modules via a symlink here.)
      - name: Run the safety-critical tests
        run: npm test -- ${{ steps.manifest.outputs.files }}
