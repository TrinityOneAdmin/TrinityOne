// The TrinityOne home-screen widget, as a local Capacitor plugin (native/trinity-widget).
// Modelled on node_modules/@capacitor/share/android/build.gradle. Plain Java + framework APIs only
// (AppWidgetProvider, RemoteViewsService, JobScheduler): no new third-party dependency.
ext {
    androidxCoreVersion = project.hasProperty('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.12.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "church.trinityone.widget"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 22
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

// Some JVM tests read the resource XML itself (test helper Xml: layouts, strings). Declare it as an input, or Gradle
// treats the test task as UP-TO-DATE after an attribute-only change and reports the previous run's result.
tasks.withType(Test).configureEach {
    inputs.dir('src/main/res').withPropertyName('widgetRes').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file('src/main/AndroidManifest.xml').withPropertyName('widgetManifest').withPathSensitivity(PathSensitivity.RELATIVE)   // ManifestPermissionTest
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.core:core:$androidxCoreVersion"
    // JVM unit tests (src/test): the plugin's argument parsing against a REAL PluginCall. org.json is the real
    // library here because android.jar's copy is a stub off-device; it parses numbers the same way (a whole number
    // that fits in 32 bits comes back as an Integer), which is the trap the tests exist for.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20231013"
    // Mockito (offline cache): only to hand onReceive an Intent, which off-device is an android.jar stub.
    testImplementation "org.mockito:mockito-core:5.2.0"
}
