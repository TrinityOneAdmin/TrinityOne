[package]
name = "trinityone-relay"
version = "0.7.1"
edition = "2021"
description = "Run your church's TrinityOne relay"

[[bin]]
name = "trinityone-relay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-shell = "2"

[profile.release]
strip = true
lto = true
